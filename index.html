<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="display">
            <div id="clear">C</div>
            <div id="screen"></div>
        </div>
        <div id="num-content">
            <div id="left">
                <div id="7" class="button num" data-value="7"></div>
                <div id="8" class="button num" data-value="8"></div>
                <div id="9" class="button num" data-value="9"></div>
                <div id="4" class="button num" data-value="4"></div>
                <div id="5" class="button num" data-value="5"></div>
                <div id="6" class="button num" data-value="6"></div>
                <div id="1" class="button num" data-value="1"></div>
                <div id="2" class="button num" data-value="2"></div>
                <div id="3" class="button num" data-value="3"></div>
                <div id="0" class="button num" data-value="0"></div>
                <div id="." class="button num" data-value="."></div>
                <div id="=" class="button" data-value="="></div>
            </div>
            <div id="right">
                <div id="/" class="button eq" data-value="÷"></div>
                <div id="*" class="button eq" data-value="*"></div>
                <div id="-" class="button eq" data-value="-"></div>
                <div id="+" class="button eq" data-value="+"></div>
            </div>
        </div>
    </div>
</body>
